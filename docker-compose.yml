version: '3.8'

services:
  # ── Backend: FastAPI ────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: customeriq_backend
    restart: always
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    # No public ports exposed directly
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./mlruns:/app/mlruns
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - customeriq_net

  # ── ML Worker: Celery ───────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: customeriq_worker
    restart: always
    command: celery -A backend.celery_app worker --loglevel=info -P solo
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
       - ./models:/app/models
       - ./mlruns:/app/mlruns
    depends_on:
      - redis
    networks:
      - customeriq_net

  # ── Cache & Broker: Redis ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: customeriq_redis
    networks:
      - customeriq_net

  # ── Frontend: Streamlit ─────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: customeriq_frontend
    restart: always
    env_file: .env
    # No public ports exposed directly
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - customeriq_net

  # ── Reverse Proxy: Nginx ──────────────────────────────────────
  nginx:
    image: nginx:stable-alpine
    container_name: customeriq_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - customeriq_net

networks:
  customeriq_net:
    driver: bridge
