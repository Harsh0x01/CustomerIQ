events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression for Performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream streamlit_server {
        server frontend:8501;
    }

    upstream fastapi_server {
        server backend:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # ── Frontend: Streamlit ─────────────────────────────────────
        location / {
            proxy_pass http://streamlit_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # ── Backend: FastAPI ────────────────────────────────────────
        location /api/ {
            proxy_pass http://fastapi_server/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Backend: OpenAPI Docs (Optional but helpful) ────────────
        location /docs {
            proxy_pass http://fastapi_server/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://fastapi_server/openapi.json;
            proxy_set_header Host $host;
        }
    }
}
